name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  pre-release-check:
    name: Pre-release QA Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestpass"
          --health-start-period=30s
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true  # pick up the newest patch (security fixes), not a cached one
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race -covermode=atomic ./...

      # Never publish binaries built against known-vulnerable code paths.
      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          # Scan every GoReleaser target: govulncheck only analyzes the active
          # GOOS/GOARCH, so OS-specific code (e.g. daemon_windows.go) and stdlib
          # paths would otherwise go unchecked. Keep in sync with .goreleaser.yml.
          fail=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "::group::govulncheck $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 govulncheck ./... || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Initialize test and Sakila databases
        # Same fixtures and loader as qa.yml: the server image's own client, so
        # client/server versions match. The Sakila tests need the sakila schema.
        run: |
          for f in init.sql sakila-schema.sql sakila-data.sql mcp_test_user.sql mcp_test_user_sakila.sql; do
            echo "Loading $f"
            docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptestpass < tests/sql/$f
          done

      - name: Integration tests
        env:
          MYSQL_DSN: "mcpuser:mcppass00@tcp(127.0.0.1:3306)/testdb?parseTime=true"
          MYSQL_TEST_DSN: "mcpuser:mcppass00@tcp(127.0.0.1:3306)/testdb?parseTime=true"
          MYSQL_SAKILA_DSN: "mcpuser:mcppass00@tcp(127.0.0.1:3306)/sakila?parseTime=true"
        run: go test -v -tags=integration ./...

  goreleaser:
    runs-on: ubuntu-latest
    needs: pre-release-check
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Note: Don't specify ref - let it checkout the tagged commit that triggered this workflow
          # GoReleaser requires HEAD to be the tagged commit for proper version extraction

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true  # pick up the newest patch (security fixes), not a cached one
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          # Explicitly checkout the tag that triggered this workflow
          # This ensures Docker builds from the tagged commit, not main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/askdba/mysql-mcp-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Get version info
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
